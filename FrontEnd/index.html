<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReCircula - Login</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background-color: #F8F4EE;
        background-image: radial-gradient(circle, #2D6A4F18 1px, transparent 1px);
        background-size: 28px 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background-color: #ffffff;
        border: 1px solid #E0D9CF;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(45,106,79,0.10);
        padding: 48px 40px;
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      h1 {
        color: #2D6A4F;
        margin-bottom: 8px;
      }
      p {
        color: #6B6B6B;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ReCircula</h1>
      <p>Bienvenido. Inicia sesión en tu cuenta.</p>
      <br><br><br>
      <p style="font-size: 12px; color: #aaa;">Economía circular de tecnología</p>
    </div>

</html>
